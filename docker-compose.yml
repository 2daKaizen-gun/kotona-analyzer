services:
  db:
    image: mysql:8.0
    container_name: kotona-mysql
    ports:
      # 호스트의 로컬 MySQL(3306)과 충돌 방지: 외부 노출은 3307.
      # 앱 컨테이너는 내부 네트워크(db:3306)로 접속하므로 영향 없음.
      - "3307:3306"
    environment:
      MYSQL_DATABASE: kotona
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 앱이 DB 준비 전에 붙어서 죽는 것을 방지
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-1234}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: kotona-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    # .env 의 GEMINI_API_KEY 등을 그대로 주입
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: kotona
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-1234}

volumes:
  mysql_data:

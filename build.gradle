plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kotona'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 기존 핵심 의존성
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // .env 파일을 읽기 위한 라이브러리
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // Google Gen AI SDK (AI Studio API 키 방식 — Vertex AI/서비스 계정 불필요)
    implementation 'com.google.genai:google-genai:1.72.0'

    // DTO record 트리 → JSON Schema 자동 생성 (Gemini responseSchema 용)
    implementation 'com.github.victools:jsonschema-generator:4.38.0'
    implementation 'com.github.victools:jsonschema-module-jackson:4.38.0'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 스키마 변경을 버전으로 관리한다. flyway-mysql 은 MySQL 방언 모듈로, 없으면 기동 시 거부된다.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 일본어 형태소 분석기 Kuromoji (ipadic 사전 포함 버전)
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'

    //Swagger UI & OpenAPI 3.0
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'
}

tasks.named('test') {
    // 'live' 는 진짜 Gemini 를 부른다. 매 푸시마다 쿼터를 쓰지 않도록 기본 테스트에서는 뺀다.
    useJUnitPlatform {
        excludeTags 'live'
    }
}

/**
 * 실제 Gemini 를 부르는 테스트만 돌린다. GEMINI_API_KEY 가 필요하고, 호출 한 번의 쿼터를 쓴다.
 * SDK 나 모델 설정을 건드린 뒤에 손으로 돌리는 용도다 — CI 에는 넣지 않는다.
 */
tasks.register('liveTest', Test) {
    group = 'verification'
    description = '실제 Gemini API 를 호출하는 테스트 (GEMINI_API_KEY 필요)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    // 실제 호출이므로 결과를 캐시에서 꺼내 오면 의미가 없다.
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('jar') {
    enabled = false // 배포에 필요 없는 plain.jar 생성 방지
}

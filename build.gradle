plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kotona'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 기존 핵심 의존성
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // .env 파일을 읽기 위한 라이브러리
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    // Google Gen AI SDK (AI Studio API 키 방식 — Vertex AI/서비스 계정 불필요)
    implementation 'com.google.genai:google-genai:1.72.0'

    // DTO record 트리 → JSON Schema 자동 생성 (Gemini responseSchema 용)
    implementation 'com.github.victools:jsonschema-generator:5.0.0'
    implementation 'com.github.victools:jsonschema-module-jackson:5.0.0'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 스키마 변경을 버전으로 관리한다. flyway-mysql 은 MySQL 방언 모듈로, 없으면 기동 시 거부된다.
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 일본어 형태소 분석기 Kuromoji (ipadic 사전 포함 버전)
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'

    //Swagger UI & OpenAPI 3.0
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
}

tasks.named('test') {
    // 'live' 는 진짜 Gemini 를 부른다. 매 푸시마다 쿼터를 쓰지 않도록 기본 테스트에서는 뺀다.
    useJUnitPlatform {
        excludeTags 'live'
    }
    finalizedBy 'jacocoTestReport'
}

/*
 * 커버리지. 처음 재 봤을 때 전체는 90% 였지만, 분석마다 지나가는 저장 경로가 0% 였고
 * 정중체 판정은 한 번도 실행된 적이 없었다. 합계만 봐서는 보이지 않는 구멍이라,
 * 매 빌드 리포트를 남기고 CI 요약에 숫자를 띄운다.
 */
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true   // CI 요약이 읽는다
        csv.required = true
        html.required = true  // 줄 단위로 어디가 비었는지 보려면 이것
    }
}

/*
 * 바닥선. 지금 수치(라인 96%, 분기 86%)보다 조금 낮게 둔다 — 작은 리팩터링까지 막을
 * 생각은 없고, 테스트 없는 기능이 통째로 들어오는 것을 막으려는 것이다.
 */
tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}

/**
 * 실제 Gemini 를 부르는 테스트만 돌린다. GEMINI_API_KEY 가 필요하고, 호출 한 번의 쿼터를 쓴다.
 * SDK 나 모델 설정을 건드린 뒤에 손으로 돌리는 용도다 — CI 에는 넣지 않는다.
 */
tasks.register('liveTest', Test) {
    group = 'verification'
    description = '실제 Gemini API 를 호출하는 테스트 (GEMINI_API_KEY 필요)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    // 실제 호출이므로 결과를 캐시에서 꺼내 오면 의미가 없다.
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('jar') {
    enabled = false // 배포에 필요 없는 plain.jar 생성 방지
}

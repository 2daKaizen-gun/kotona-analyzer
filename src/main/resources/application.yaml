spring:
  application:
    name: analyzer

  # [추가] MySQL 같은 외부 DB에서도 schema.sql, data.sql을 읽게 합니다.
  sql:
    init:
      mode: always

  datasource:
    hikari:
      connection-timeout: 5000
    # DB 접속 정보는 환경변수로 주입(없으면 로컬 개발 기본값 사용).
    # 컨테이너 실행 시 DB_HOST=db 로 오버라이드된다.
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:kotona}?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 기존의 jpa: jpa: 중첩을 제거하고 하나로
    hibernate:
      ddl-auto: update
    show-sql: true
    # Hibernate가 테이블을 체크한 '뒤'에 SQL 파일을 실행하게 함
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# 커스텀 변수 (제미나이 설정)
gemini:
  project-id: ${GCP_PROJECT_ID}
  api-key: ${GEMINI_API_KEY}

# 유령 서버 피해 이동
server:
  port: 8081
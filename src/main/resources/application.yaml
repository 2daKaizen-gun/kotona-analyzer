spring:
  application:
    name: analyzer

  # 스키마는 Flyway 가 관리한다. schema.sql / data.sql 은 db/migration 으로 옮겨졌다.
  flyway:
    # 이미 테이블이 있는 DB 는 V1 이 적용된 것으로 간주하고 건너뛴다.
    # V1 은 실물 DB 를 조회해 그대로 옮긴 것이라, 새 DB 도 같은 모양으로 만들어진다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "hibernate ddl-auto 로 만들어진 기존 스키마"

  datasource:
    hikari:
      connection-timeout: 5000
    # DB 접속 정보는 환경변수로 주입(없으면 로컬 개발 기본값 사용).
    # 컨테이너 실행 시 DB_HOST=db 로 오버라이드된다.
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:kotona}?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. Hibernate 는 엔티티와 실제 테이블이 어긋나면
      # 조용히 고치는 대신 기동을 멈춘다 — 그게 이 설정의 목적이다.
      # update 는 컬럼을 더하기만 하고 지우거나 좁히지 않아서, 지워진 필드의 컬럼이
      # 영원히 남고 이름을 바꾸면 컬럼이 둘로 늘어난다.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# 커스텀 변수 (Gemini / Google AI Studio 설정)
gemini:
  # GEMINI_API_KEY 환경변수(.env 포함)에서 주입된다. 미설정 시 기동 단계에서 실패한다.
  # 발급: https://aistudio.google.com/apikey (결제 계정 불필요, 무료 티어)
  api-key: ${GEMINI_API_KEY:}
  # gemini-2.5-flash 는 신규 키에 더 이상 제공되지 않는다(404). 3.6-flash 가 현행 무료 티어 모델.
  model: ${GEMINI_MODEL:gemini-3.6-flash}
  # low | high — 비우면 모델 기본값.
  # low 로 두면 응답은 빨라지지만 일본어 답장 중간에 한국어·영어가 섞여 나온다
  # ("予算や schedule 面で", "ご 불명한 점"). 같은 응답 안에서 한국어 설명과 일본어 문장을
  # 동시에 쓰게 하는 구조라 코드 스위칭이 일어나고, AnalysisValidator 가 그 항목을 버리는
  # 탓에 답장이 3개에서 1개로 줄었다. high 로 올리면 이 현상이 사라진다.
  thinking-level: ${GEMINI_THINKING_LEVEL:high}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:8000}
  temperature: ${GEMINI_TEMPERATURE:0.7}

# 애플리케이션 보안 설정
app:
  # 리버스 프록시(nginx, ALB 등) 뒤에 있을 때만 true.
  # 직접 노출된 서버에서 켜면 X-Forwarded-For 위조로 rate limit 을 우회당한다.
  trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  cors:
    # 콤마 구분. 프론트 배포 후 실제 도메인으로 교체할 것.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 유령 서버 피해 이동
server:
  port: 8081
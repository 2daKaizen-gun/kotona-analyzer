name: KOTONA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 깃허브에서 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon

      # 빌드된 파일만 서버로 전송
      - name: Deploy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "~/app"
          strip_components: 2

      # 서버에서는 실행만 시킴
      - name: Restart Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ! type java > /dev/null 2>&1 && sudo dnf install -y java-21-amazon-corretto-devel
            CURRENT_PID=$(pgrep -f "app.jar" || true)
            if [ -n "$CURRENT_PID" ]; then
              kill -15 $CURRENT_PID
              sleep 5
            fi
            export GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            nohup java -jar ~/app/*.jar \
              --spring.datasource.password="root" \
              --google.key.path="$HOME/app/google-key.json" \
              > ~/app/app.log 2>&1 &
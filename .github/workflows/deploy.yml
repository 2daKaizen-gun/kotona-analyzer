name: KOTONA CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 필수 환경 확인
            ! type git > /dev/null 2>&1 && sudo dnf install -y git
            ! type java > /dev/null 2>&1 && sudo dnf install -y java-21-amazon-corretto-devel

            APP_DIR="$HOME/app"
            REPO_URL="https://github.com/2daKaizen-gun/kotona-analyzer.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf $APP_DIR
              git clone $REPO_URL $APP_DIR
            fi

            cd $APP_DIR

            # 2. 코드 동기화 최적화
            # 빌드 파일 충돌 방지를 위한 로컬 초기화
            git reset --hard HEAD
            git clean -fd
            git pull origin main

            # 3. 자원 확보 
            ./gradlew --stop || true
            
            CURRENT_PID=$(pgrep -f "app.jar" | grep -v "$$" || true)
            if [ -n "$CURRENT_PID" ]; then
              kill -15 $CURRENT_PID 2>/dev/null || true
              sleep 5
            fi

            # 4. 메모리 절약형 빌드
            chmod +x ./gradlew
            ./gradlew clean bootJar -x test --no-daemon

            # 5. 보안 및 환경 변수 주입 실행
            nohup java -jar \
              -DGCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}" \
              -DGEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -Dspring.datasource.password="root" \
              -Dgoogle.key.path="$HOME/app/google-key.json" \
              build/libs/*.jar > app.log 2>&1 &
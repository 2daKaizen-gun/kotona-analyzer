name: KOTONA CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. JDK 21 설정 및 Gradle 캐싱
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      # 3. SSH Key 설정
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2.7.0
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          known_hosts: 'just-placeholder'
          if_key_exists: replace

      # 4. 빌드 (t2.micro 등 저사양 EC2 배포를 고려한 메모리 절약 빌드)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test --no-daemon

      # 5. Native SCP 전송 (가장 빠른 전송 방식)
      - name: Fast SCP Transfer
        run: |
        # StrictHostKeyChecking=no를 통해 known_hosts 관련 번거로움 해결
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} "mkdir -p ~/app/current"
          scp -o StrictHostKeyChecking=no build/libs/*.jar ec2-user@${{ secrets.EC2_HOST }}:~/app/current/app.jar

      # 6. 서버 무중단(유사) 재시작
      - name: Restart Server
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
        # 기존 프로세스 안전하게 종료
            CURRENT_PID=$(pgrep -f "app.jar" || true)
            if [ -n "$CURRENT_PID" ]; then
              kill -15 $CURRENT_PID
              sleep 5
            fi

            # 환경변수 주입 (보안상 최선책)
            export GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          
            # 백그라운드 실행 및 로그 남기기
            nohup java -jar ~/app/current/app.jar \
              --spring.datasource.password="root" \
              --google.key.path="$HOME/app/google-key.json" \
              > ~/app/app.log 2>&1 &
          EOF
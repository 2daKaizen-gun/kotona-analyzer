name: KOTONA CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      # 빌드된 JAR 파일을 EC2로 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "~/app/current"
          strip_components: 2

      # 서버에서 실행 (환경변수 방식)
      - name: Execute Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_DIR="$HOME/app/current"
            
            # 구형 프로세스 종료
            CURRENT_PID=$(pgrep -f "app.jar" || true)
            if [ -n "$CURRENT_PID" ]; then
              kill -15 $CURRENT_PID
              sleep 5
            fi

            # 환경변수로 시크릿 주입하며 실행
            # (GCP 키 파일은 서버의 특정 경로에 미리 저장되어 있다고 가정)
            export GCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            
            nohup java -jar $APP_DIR/*.jar \
              --spring.datasource.password="root" \
              --google.key.path="$HOME/app/google-key.json" \
              > $HOME/app/app.log 2>&1 &
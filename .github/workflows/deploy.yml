name: KOTONA CI/CD Pipeline

# main 브랜치에 코드가 push될 때 실행
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # 깃허브 액션이 Node.js 24를 사용하도록 강제
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # 401 에러 방지를 위해 명시적 권한을 부여
    permissions:
      contents: write
      packages: write

    steps:
      # GitHub 레포지토리의 코드를 가져옴
      - name: Checkout Code
        uses: actions/checkout@v5

      # Java 21 환경을 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 빌드 권한을 부여하고 Jar 파일을 빌드
      # 테스트는 로컬에서 확인했으므로 빌드 속도를 위해 제외(-x test)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      # 빌드된 Jar 파일을 AWS EC2로 전송하고 실행
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user  # Amazon Linux 2023 기본 계정
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            APP_DIR="$HOME/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git $APP_DIR
            else
              cd $APP_DIR && git pull origin main
            fi
            cd $APP_DIR
            CURRENT_PID=$(pgrep -f "app.jar" | grep -v "$$" || true)
            if [ -n "$CURRENT_PID" ]; then
              kill -15 $CURRENT_PID
              sleep 5
            fi
            chmod +x ./gradlew
            ./gradlew bootJar -x test
            
            # 백그라운드에서 애플리케이션 실행
            # 로그는 app.log에 기록
            nohup java -jar build/libs/*.jar > app.log 2>&1 &
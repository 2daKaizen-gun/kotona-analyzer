name: KOTONA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Deploy and Restart Server via Native SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} "mkdir -p ~/app"

          scp -o StrictHostKeyChecking=no -C build/libs/*.jar ec2-user@${{ secrets.EC2_HOST }}:~/app/app.jar

          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
            ! type java > /dev/null 2>&1 && sudo dnf install -y java-21-amazon-corretto-devel
          
            CURRENT_PID=$(pgrep -f "app.jar" || true)
            if [ -n "$CURRENT_PID" ]; then
              echo "Stopping existing process: $CURRENT_PID"
              kill -15 $CURRENT_PID
              sleep 5
            fi

            nohup java -DGCP_PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}" \
                       -DGEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
                       -Dgemini.project-id="${{ secrets.GCP_PROJECT_ID }}" \
                       -Dgemini.api-key="${{ secrets.GEMINI_API_KEY }}" \
                       -jar ~/app/app.jar \
                       --spring.datasource.password="root" \
                       --google.key.path="$HOME/app/google-key.json" \
                       > ~/app/app.log 2>&1 &
          
            echo "Successfully deployed KOTONA project with Injected Secrets!"
          EOF
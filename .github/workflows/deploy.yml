name: KOTONA CI/CD Pipeline

# main 브랜치에 코드가 push될 때 실행
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # GitHub 레포지토리의 코드를 가져옴
      - name: Checkout Code
        uses: actions/checkout@v4

      # Java 21 환경을 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 빌드 권한을 부여하고 Jar 파일을 빌드
      # 테스트는 로컬에서 확인했으므로 빌드 속도를 위해 제외(-x test)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      # 빌드된 Jar 파일을 AWS EC2로 전송하고 실행
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user  # Amazon Linux 2023 기본 계정
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 서버에 앱이 위치할 디렉토리 생성
            mkdir -p ~/app
            cd ~/app

            # 기존에 실행 중인 서버 프로세스 종료 (있을 경우만)
            PID=$(pgrep -f "app.jar" || true)
            if [ -n "$PID" ]; then
              echo "Stopping existing application (PID: $PID)..."
              kill -15 $PID
              sleep 5
            fi
            
            # 현재는 가장 심플한 Git Pull & Build 방식으로 진행
            git pull origin main
            chmod +x ./gradlew
            ./gradlew bootJar -x test

            # 백그라운드에서 애플리케이션 실행
            # 로그는 app.log에 기록
            nohup java -jar build/libs/*.jar > app.log 2>&1 &

# 의존성 업데이트를 주 1회 PR 로 받는다.
#
# 이 파일이 생기기 전에는 Spring Boot 가 패치 여섯 개를 뒤처질 때까지 아무도 몰랐다.
# 패치 릴리스에는 보안 수정이 실린다. 알려 주는 쪽이 없으면 뒤처진다.
#
# 마이너·패치는 한 PR 로 묶는다. 하나씩 오면 매주 PR 이 여러 개 쌓여 결국 아무도 안 본다.
# 메이저는 따로 온다 — 깨질 수 있는 변경은 섞지 않고 하나씩 본다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
